services:
  authentik-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authentik-manager
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Loads all configuration directly from your .env file
    env_file:
      - .env
    volumes:
      - manager-data:/app/data

volumes:
  manager-data:
    driver: local
