services:
  authentik-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authentik-manager
    restart: unless-stopped
    ports:
      # Bound to loopback by default for security; place behind reverse proxy (e.g. Caddy, Traefik, Nginx)
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    # Loads all configuration directly from your .env file
    env_file:
      - .env
    volumes:
      - manager-data:/app/data

volumes:
  manager-data:
    driver: local
